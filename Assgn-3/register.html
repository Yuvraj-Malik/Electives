<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SEAferno 2026 | Registration</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <nav class="navbar">
        <div class="logo">SEA<span>ferno</span></div>

        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="events.html">Events</a></li>
            <li><a href="schedule.html">Schedule</a></li>
            <li><a href="register.html" class="active">Register</a></li>
            <li><a href="gallery.html">Gallery</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>

        <button class="menu-btn" onclick="toggleMenu()">☰</button>
    </nav>
</header>

<main>

<section class="page-header">
    <p>READY TO JOIN?</p>
    <h1>Register <span>Now</span></h1>
    <p>Secure your spot at SEAferno 2026.</p>
</section>

<section class="section">

    <div class="form-container">

        <form id="registrationForm" onsubmit="submitRegistration(event)">

            <div class="form-group">
                <label for="name">Full Name</label>
                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Enter your full name"
                    required
                >
            </div>


            <div class="form-row">

                <div class="form-group">
                    <label for="email">Email</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="example@email.com"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <input
                        type="tel"
                        id="phone"
                        name="phone"
                        placeholder="9876543210"
                        required
                    >
                </div>

            </div>


            <div class="form-group">
                <label for="college">College / University</label>
                <input
                    type="text"
                    id="college"
                    name="college"
                    placeholder="Enter your college name"
                    required
                >
            </div>


            <div class="form-group">
                <label for="date">Date of Birth</label>
                <input
                    type="date"
                    id="date"
                    name="date"
                    required
                >
            </div>


            <div class="form-group">
                <label>Participation Type</label>

                <div class="radio-group">
                    <label>
                        <input type="radio" name="type" value="individual" required>
                        Individual
                    </label>

                    <label>
                        <input type="radio" name="type" value="team">
                        Team
                    </label>
                </div>
            </div>


            <div class="form-group">
                <label for="event">Select Event</label>

                <select id="event" name="event" required>
                    <option value="">-- Select an Event --</option>
                    <option value="code">Code Clash</option>
                    <option value="band">Battle of Bands</option>
                    <option value="dance">Dance Face-Off</option>
                    <option value="quiz">Quiz Mania</option>
                    <option value="photography">Photography Challenge</option>
                    <option value="treasure">Treasure Hunt</option>
                </select>
            </div>


            <div class="form-group">
                <label>Interests</label>

                <div class="checkbox-group">
                    <label>
                        <input type="checkbox" name="interest" value="technical">
                        Technical
                    </label>

                    <label>
                        <input type="checkbox" name="interest" value="cultural">
                        Cultural
                    </label>

                    <label>
                        <input type="checkbox" name="interest" value="fun">
                        Fun Events
                    </label>
                </div>
            </div>


            <div class="form-group">
                <label for="message">Additional Information</label>

                <textarea
                    id="message"
                    name="message"
                    rows="5"
                    placeholder="Tell us anything we should know..."
                ></textarea>
            </div>


            <div class="form-group terms">
                <label>
                    <input type="checkbox" required>
                    I agree to the event rules and terms.
                </label>
            </div>


            <div class="form-buttons">
                <button type="submit" class="btn">Submit Registration</button>
                <button type="reset" class="btn btn-outline">Reset</button>
            </div>

        </form>

        <p id="formMessage"></p>

    </div>

</section>

</main>

<footer>
    <p>© 2026 SEAferno. All Rights Reserved.</p>
    <p>Made for the college fest.</p>
</footer>

<script src="script.js"></script>

</body>
</html>
